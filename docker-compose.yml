version: "3.9"

services:
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "9090:9090"
      - "3100:3100"
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    environment:
      - ENABLE_LOGS_ALL=true
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/3000'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: aiops
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: aiops
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops -d aiops"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.core
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-lgtm:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://aiops:aiops@postgres:5432/aiops
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  generator:
    build:
      context: .
      dockerfile: plugins/generator/Dockerfile
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318

  agent-monitor:
    build:
      context: .
      dockerfile: plugins/agent_monitor/Dockerfile
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OLLAMA_BASE_URL: http://ollama:11434

  rca-engine:
    build:
      context: .
      dockerfile: plugins/rca_engine/Dockerfile
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434

  chatbot:
    build:
      context: .
      dockerfile: plugins/chatbot/Dockerfile
    restart: unless-stopped
    ports:
      - "8004:8004"
    depends_on:
      api-gateway:
        condition: service_healthy
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      DATABASE_URL: postgresql+asyncpg://aiops:aiops@postgres:5432/aiops

  alert-noc:
    build:
      context: .
      dockerfile: plugins/alert_noc/Dockerfile
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8005/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  infra-simulator:
    build:
      context: .
      dockerfile: plugins/infra_simulator/Dockerfile
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
      alert-noc:
        condition: service_healthy
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318

  network-sim:
    build:
      context: .
      dockerfile: plugins/network_sim/Dockerfile
    restart: unless-stopped
    ports:
      - "8013:8013"
    environment:
      - DATABASE_URL=postgresql+asyncpg://aiops:aiops@postgres:5432/aiops
      - REDIS_URL=redis://:changeme@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data: