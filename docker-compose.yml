version: "3.9"

services:
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"
      - "9090:9090"
      - "3100:3100"
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel-lgtm/config:/etc/otel-lgtm
    environment:
      - ENABLE_LOGS_ALL=true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: aiops
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: aiops
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops -d aiops"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.core
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-lgtm:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://aiops:aiops@postgres:5432/aiops
      REDIS_URL: redis://redis:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  generator:
    build:
      context: .
      dockerfile: plugins/generator/Dockerfile
    depends_on:
      api-gateway:
        condition: service_healthy
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318

  agent-monitor:
    build:
      context: .
      dockerfile: plugins/agent_monitor/Dockerfile
    depends_on:
      api-gateway:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OLLAMA_BASE_URL: http://ollama:11434

  rca-engine:
    build:
      context: .
      dockerfile: plugins/rca_engine/Dockerfile
    depends_on:
      api-gateway:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434

  chatbot:
    build:
      context: .
      dockerfile: plugins/chatbot/Dockerfile
    depends_on:
      api-gateway:
        condition: service_healthy
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      REDIS_URL: redis://redis:6379/0

  alert-noc:
    build:
      context: .
      dockerfile: plugins/alert_noc/Dockerfile
    depends_on:
      api-gateway:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data: